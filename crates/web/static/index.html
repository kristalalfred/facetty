<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0c0e">
<title>facetty</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0e'/%3E%3Ctext x='16' y='23' font-family='Menlo,monospace' font-size='20' font-weight='700' fill='%23e8e8ea' text-anchor='middle'%3E@%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --background: #0c0c0e;
    --surface: #141417;
    --raised: #222227;
    --hover: #2e2e34;
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8e8ea;
    --dim: rgba(232, 232, 234, 0.5);
    --alert: #e5484d;
    --alert-hover: #ee5f63;
    --speaking: #3dd68c;
    --link: #8ab4ff;
    --chat-width: 340px;
    --bar-height: 80px;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--background); }
  body { position: relative; font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #tiles { position: fixed; inset: 0; pointer-events: none; }
  .tile { position: absolute; border-radius: 10px; transition: outline-color 0.15s; outline: 2px solid transparent; outline-offset: 5px; }
  .tile.unlit { background: var(--surface); }
  .tile.speaking { outline-color: var(--speaking); }
  .tag { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 32px); padding: 3px 8px; border-radius: 6px; background: rgba(12, 12, 14, 0.75); font-size: 13px; white-space: nowrap; }
  .tag span { overflow: hidden; text-overflow: ellipsis; }
  .tag svg { display: none; flex: none; width: 14px; height: 14px; color: var(--alert); }
  .tile.muted .tag svg { display: block; }
  .tile.unlit .tag { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); background: none; font-size: 17px; color: var(--dim); }
  .tile.unlit .tag svg { width: 17px; height: 17px; }
  .reaction { position: absolute; bottom: 0; font-size: 34px; line-height: 1; animation: rise 4s ease-out forwards; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    8% { opacity: 1; transform: translateY(-4%) scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translateY(calc(40px - var(--height))); }
  }
  @media (prefers-reduced-motion: reduce) {
    .reaction { animation-name: fade; bottom: 40%; }
    @keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
  }

  #toasts { position: fixed; top: 16px; right: 16px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
  .toast { max-width: min(360px, calc(100vw - 32px)); padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); font-size: 14px; overflow-wrap: anywhere; animation: toast 0.18s ease-out; transition: opacity 0.3s; }
  .toast.leaving { opacity: 0; }
  @keyframes toast { from { opacity: 0; transform: translateY(-6px); } }

  #chat { position: fixed; top: 0; right: 0; bottom: 0; z-index: 3; width: var(--chat-width); box-sizing: border-box; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--surface); }
  #messages { flex: 1; margin: 0; padding: 8px 16px 16px; overflow-y: auto; list-style: none; }
  #messages li { margin-top: 2px; }
  #messages .from { display: block; margin-top: 12px; font-size: 12px; color: var(--dim); }
  #messages .mine .from { color: var(--speaking); }
  #messages p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  #messages a { color: var(--link); }
  #compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  #say { flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--line); border-radius: 20px; outline: none; background: var(--background); }
  #say:focus { border-color: rgba(255, 255, 255, 0.28); }
  #compose button { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--text); color: var(--background); }
  #compose button svg { width: 20px; height: 20px; }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); pointer-events: none; }
  #bar > * { pointer-events: auto; }
  .control { position: relative; flex: none; width: 48px; height: 48px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: var(--raised); transition: background 0.15s, color 0.15s; }
  .control:hover { background: var(--hover); }
  .control svg { width: 22px; height: 22px; }
  .control .off-icon, .control.off .on-icon { display: none; }
  .control.off .off-icon { display: block; }
  .control.off, #leave { background: var(--alert); }
  .control.off:hover, #leave:hover { background: var(--alert-hover); }
  .control.active { background: var(--text); color: var(--background); }
  .control:disabled { opacity: 0.4; cursor: default; }
  .badge { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border: 2px solid var(--raised); border-radius: 50%; background: var(--alert); }
  #leave { width: 64px; border-radius: 24px; }
  #leave svg { width: 26px; height: 26px; }
  .divider { flex: none; width: 1px; height: 28px; margin: 0 4px; background: var(--line); }
  #join { display: flex; gap: 8px; margin: 0 0 0 8px; }
  #name { width: 220px; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 20px; border: 1px solid transparent; border-radius: 24px; outline: none; background: var(--raised); }
  #name:focus { border-color: rgba(255, 255, 255, 0.28); }
  .pill { height: 48px; padding: 0 26px; border: 0; border-radius: 24px; background: var(--text); color: var(--background); font-weight: 600; }
  .pill:disabled { opacity: 0.5; cursor: default; }

  [popover] { inset: auto; left: 50%; bottom: var(--bar-height); transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55); }
  #reactions:popover-open { display: grid; grid-template-columns: repeat(8, 44px); gap: 2px; }
  #reactions button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: none; font-size: 26px; line-height: 1; transition: transform 0.1s, background 0.15s; }
  #reactions button:hover { background: var(--raised); transform: scale(1.12); }
  #reactions button:active { transform: scale(0.94); }
  #settings { width: 320px; padding: 12px; }
  #settings:popover-open { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 12px; min-height: 36px; }
  .row > svg { width: 20px; height: 20px; color: var(--dim); }
  .row select { width: 100%; min-width: 0; height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
  .row input[type=range] { width: 100%; accent-color: var(--text); }
  .row input[type=checkbox] { justify-self: start; width: 40px; height: 22px; margin: 0; appearance: none; border-radius: 11px; background: var(--raised); position: relative; cursor: pointer; transition: background 0.15s; }
  .row input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: transform 0.15s, background 0.15s; }
  .row input[type=checkbox]:checked { background: var(--text); }
  .row input[type=checkbox]:checked::after { transform: translateX(18px); background: var(--background); }
  #settings hr { width: 100%; height: 1px; margin: 2px 0; border: 0; background: var(--line); }
  .choices { display: flex; gap: 6px; }
  .choices button { flex: 1; height: 36px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--dim); }
  .choices button:hover { background: var(--raised); }
  .choices button[aria-pressed=true] { border-color: var(--text); color: var(--text); background: var(--raised); }
  .choices svg { width: 20px; height: 20px; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; }

  #ended { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 24px; text-align: center; color: var(--dim); }
  #message:empty { display: none; }

  body[data-phase=lobby] :is(.in-call, .tag), body[data-phase=call] .in-lobby { display: none !important; }
  body[data-phase=ended] :is(canvas, #tiles, #bar, #chat, #toasts) { display: none; }
  body:not([data-phase=ended]) #ended { display: none; }
  @media (min-width: 721px) {
    body.chatting #bar { right: var(--chat-width); }
    body.chatting [popover] { left: calc((100vw - var(--chat-width)) / 2); }
    body.chatting #toasts { right: calc(var(--chat-width) + 16px); }
  }
  @media (max-width: 720px) {
    #chat { left: 0; width: auto; bottom: var(--bar-height); border-left: 0; }
    #bar { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .control { width: 44px; height: 44px; }
    #leave { width: 56px; }
    .divider { display: none; }
    #join { flex: 1; min-width: 0; margin: 0; }
    #name { flex: 1; width: auto; }
    .pill { padding: 0 20px; }
  }
  @media (max-width: 420px) {
    #reactions:popover-open { grid-template-columns: repeat(4, 44px); }
  }
</style>
</head>
<body data-phase="lobby">
<canvas id="view"></canvas>
<div id="tiles"></div>
<div id="toasts" aria-live="polite"></div>

<aside id="chat" hidden>
  <ol id="messages"></ol>
  <form id="compose">
    <input id="say" maxlength="500" autocomplete="off" placeholder="Message" aria-label="Message">
    <button aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
</aside>

<nav id="bar">
  <button id="mic" class="control" title="Microphone (m)" aria-label="Microphone">
    <svg class="on-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    <svg class="off-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M4 4l16 16"/></svg>
  </button>
  <button id="camera" class="control" title="Camera (v)" aria-label="Camera">
    <svg class="on-icon" viewBox="0 0 24 24"><rect x="3" y="6" width="12.5" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3"/></svg>
    <svg class="off-icon" viewBox="0 0 24 24"><rect x="3" y="6" width="12.5" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3M3 3l18 18"/></svg>
  </button>
  <form id="join" class="in-lobby">
    <input id="name" maxlength="32" autocomplete="nickname" placeholder="Name" aria-label="Name" enterkeyhint="go">
    <button class="pill">Join</button>
  </form>
  <button id="react" class="control in-call" popovertarget="reactions" title="React (r, 1–8)" aria-label="React">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
  </button>
  <button id="chat-button" class="control in-call" title="Chat (t)" aria-label="Chat">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v10a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></svg>
    <span class="badge" hidden></span>
  </button>
  <button id="invite" class="control in-call" title="Copy invite link (c)" aria-label="Copy invite link">
    <svg viewBox="0 0 24 24"><circle cx="9.5" cy="8" r="4"/><path d="M2.5 20a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>
  </button>
  <button id="settings-button" class="control in-call" popovertarget="settings" title="Settings (d)" aria-label="Settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
  </button>
  <span class="divider in-call"></span>
  <button id="leave" class="control in-call" title="Leave (q)" aria-label="Leave">
    <svg viewBox="0 0 24 24"><path d="M3.2 14.6c-.3-1 0-2 .9-2.6C6.4 10.4 9.1 9.6 12 9.6s5.6.8 7.9 2.4c.9.6 1.2 1.6.9 2.6l-.4 1.2a1.2 1.2 0 0 1-1.5.8l-3-.9a1.2 1.2 0 0 1-.8-1.1v-1.7a11 11 0 0 0-6.2 0v1.7a1.2 1.2 0 0 1-.8 1.1l-3 .9a1.2 1.2 0 0 1-1.5-.8z"/></svg>
  </button>
</nav>

<div id="reactions" popover></div>

<div id="settings" popover>
  <label class="row" title="Camera"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12.5" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3"/></svg><select id="camera-device" aria-label="Camera"></select></label>
  <label class="row" title="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><select id="mic-device" aria-label="Microphone"></select></label>
  <label class="row" id="speaker-row" title="Speaker"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><select id="speaker-device" aria-label="Speaker"></select></label>
  <hr>
  <div class="choices" id="views">
    <button data-choice="grid" title="Grid (l)" aria-label="Grid"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="7" height="6" rx="1"/><rect x="13" y="5" width="7" height="6" rx="1"/><rect x="4" y="13" width="7" height="6" rx="1"/><rect x="13" y="13" width="7" height="6" rx="1"/></svg></button>
    <button data-choice="speaker" title="Speaker (l)" aria-label="Speaker"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="11" rx="1"/><rect x="3" y="17.5" width="5" height="3" rx="1"/><rect x="9.5" y="17.5" width="5" height="3" rx="1"/><rect x="16" y="17.5" width="5" height="3" rx="1"/></svg></button>
  </div>
  <div class="choices" id="palettes">
    <button data-choice="natural" title="Natural (p)" aria-label="Natural"><span class="swatch" style="background: conic-gradient(#d9a066, #6fa8c9, #86b97a, #c98a8a, #d9a066)"></span></button>
    <button data-choice="vivid" title="Vivid (p)" aria-label="Vivid"><span class="swatch" style="background: conic-gradient(#ff3d6e, #ffd23f, #3dff8b, #3dc8ff, #b43dff, #ff3d6e)"></span></button>
    <button data-choice="mono" title="Mono (p)" aria-label="Mono"><span class="swatch" style="background: #e6e6e6"></span></button>
    <button data-choice="matrix" title="Matrix (p)" aria-label="Matrix"><span class="swatch" style="background: #28ff5a"></span></button>
  </div>
  <label class="row" title="Edges (e)"><svg viewBox="0 0 24 24"><path d="M4 19 9.5 5M14.5 5 20 19"/></svg><input type="checkbox" id="edges" role="switch" aria-label="Edges"></label>
  <label class="row" title="Exposure ([ and ])"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><input type="range" id="exposure" min="0.2" max="4" step="0.1" aria-label="Exposure"></label>
</div>

<div id="ended">
  <p id="message"></p>
  <button id="rejoin" class="pill" hidden>Rejoin</button>
</div>

<script type="module">
  import init from "/web/facetty_web.js";
  init();
</script>
</body>
</html>
