[package]
name = "bits"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bits-ascii = { version = "0.1.0", path = "../ascii" }
bits-audio = { version = "0.1.0", path = "../audio" }
bits-proto = { version = "0.1.0", path = "../proto" }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream", "use-dev-tty"] }
futures-util = "0.3.34"
hex = "0.4.3"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
bits-sfu = { path = "../sfu" }
bits-signal = { path = "../signal" }
