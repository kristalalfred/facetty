[package]
name = "bits"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bits-ascii = { version = "0.1.0", path = "../ascii" }
bits-audio = { version = "0.1.0", path = "../audio" }
bits-proto = { version = "0.1.0", path = "../proto" }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
hex = "0.4.3"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
ratatui = "0.30.2"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
