[package]
name = "facetty-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
postcard = { version = "1.1.3", features = ["use-std"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
web-transport-quinn = { version = "0.13.5", default-features = false, features = ["ring"], optional = true }
tokio = { version = "1.53.2", features = ["io-util", "rt", "sync"], optional = true }

[features]
default = ["quic"]
quic = ["dep:quinn", "dep:tokio", "dep:web-transport-quinn"]

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "io-util"] }
